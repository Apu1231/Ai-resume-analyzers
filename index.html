<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Resume Analyser</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.8.0/fonts/remixicon.css" rel="stylesheet" />
</head>

<body>
  <header class="header">
    <h1>AI Resume Analyser</h1>
    <p>Upload your resume and get ATS + AI feedback instantly</p>
  </header>

  <main class="container">
    <!-- Upload Card -->
    <section class="card">
      <label for="fileInput" id="upload">
        Upload your resume <i class="ri-file-text-line"></i>
      </label>
      <input type="file" id="fileInput" accept=".pdf,.doc,.docx" hidden />

      <label for="text" class="jd-label">Job Description</label>
      <textarea id="text" placeholder="Paste job description here..."></textarea>

      <button id="analysis">Analyze Resume</button>
    </section>

    <!-- Resume Preview -->
    <section class="card analysis"></section>

    <!-- Result -->
    <section class="card result"></section>
  </main>

  <!-- Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://unpkg.com/mammoth/mammoth.browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <script src="script.js"></script>
</body>
</html>
