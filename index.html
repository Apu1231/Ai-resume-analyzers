<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ai Resume Analyser</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.8.0/fonts/remixicon.css" rel="stylesheet" />
</head>

<body>
    <header>
        <h1>Ai Resume Analyser</h1>
        <p>
            Upload your resume to get instant feedback and suggestions for improvement using AI technology.
        </p>

    </header>
    <main>
        <section class="upload">
            <label for="fileInput" id="upload">Upload your resume <i class="ri-file-text-line"></i></label>
            <input type="file" id="fileInput" accept=".pdf,.doc,.docx" hidden>
            <label for="text">Write your job description: </label>
            <textarea name="" id="text"></textarea>
            <button id="analysis">Analysis</button>
            <div class="analysis"></div>
            <div class="result"></div>
        </section>
    </main>
    <!-- Pdf js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <!-- mammoth.js -->
    <script src="https://unpkg.com/mammoth/mammoth.browser.min.js"></script>
    <!--  ocr -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

    <script src="script.js"></script>
</body>

</html>
